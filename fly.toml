# fly.toml app configuration file for gestaoconsultorias
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gestaoconsultorias'
primary_region = 'gru'

[build]
[[mounts]]
  source = 'gestao_data'
  destination = '/app/storage'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
